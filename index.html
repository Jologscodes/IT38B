<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonprofit Resource Management</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: red;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 1000px;
        }
        .header {
            color: white;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 1px 1px 2px black;
            margin-bottom: 20px;
        }
        .main-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        .circle-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .circle {
            background: white;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.3);
            overflow: hidden; 
        }
        .circle img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }
        .login-box {
            flex: 1;
            background: #333;
            padding: 30px;
            border-radius: 8px;
            width: 320px;
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.3);
            color: white;
            text-align: left;
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: darkblue;
        }
        p {
            text-align: center;
            margin-top: 10px;
        }
        a {
            color: lightblue;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header">Nonprofit Resource Management</h1>
        <div class="main-content">
            <div class="circle-section">
                <div class="circle">
                    <img src="https://wallacefoundation.org/sites/default/files/2023-09/sfm-home-page-graphic.png" alt="">
                </div>
            </div>
            <div class="login-box">
                <h2>LOGIN</h2>
                <form onsubmit="return loginUser(event)">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit">LOG IN</button>
                </form>
                <p>Don't have an account? <a href="#">Register here</a></p>
            </div>
            
            <script>
                function loginUser(event) {
                    event.preventDefault(); 
            
                    let username = document.getElementById("username").value;
                    let password = document.getElementById("password").value;
            
                    if (username.trim() === "" || password.trim() === "") {
                        alert("Please enter a valid username and password.");
                        return false;
                    }
            
                    
                    let loginHistory = JSON.parse(localStorage.getItem("loginHistory")) || [];
                    let loginEntry = { username: username, timestamp: new Date().toLocaleString() };
                    loginHistory.push(loginEntry);
                    localStorage.setItem("loginHistory", JSON.stringify(loginHistory));
            
                    
                    localStorage.setItem("currentUser", username);
            
                    
                    window.location.href = "dashboard.html";
                    return false;
                }
            </script>
