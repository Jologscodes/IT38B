<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonprofit Resource Management - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #d32f2f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 350px;
            text-align: center;
        }
        .login-box {
            background-color: #333;
            color: white;
            padding: 20px;
            border-radius: 8px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }
        .login-btn {
            background-color: #1976d2;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
        }
        .login-btn:hover {
            background-color: #1565c0;
        }
        .signup-link {
            color: lightgray;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #d32f2f;">Nonprofit Resource Management</h2>
        <div class="login-box">
            <h3>LOGIN</h3>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="login-btn">LOG IN</button>
            </form>
            <p class="signup-link">Don't have an account? <a href="#" style="color: #64b5f6;">Sign up here</a></p>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            
            if (username === "admin" && password === "password123") {
                alert("Login successful!");
    
                // Store login history in localStorage
                let loginHistory = JSON.parse(localStorage.getItem("loginHistory")) || [];
                loginHistory.push({
                    username: username,
                    timestamp: new Date().toLocaleString()
                });
                localStorage.setItem("loginHistory", JSON.stringify(loginHistory));
    
                // Redirect to admin dashboard
                window.location.href = "admin-dashboard.html";
            } else {
                alert("Invalid credentials. Try again.");
            }
        });
    </script>
    
</body>
</html>
