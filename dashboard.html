<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard with Sidebar and Logo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 200px;
      background-color: #1976d2;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
    }

    .sidebar img {
      width: 180px; /* Made logo bigger */
      height: auto;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    .sidebar button {
      background: none;
      border: none;
      color: white;
      padding: 15px 20px;
      text-align: left;
      width: 100%;
      font-size: 18px;
      cursor: pointer;
    }

    .sidebar button:hover {
      background-color: #1565c0;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column; /* To stack elements vertically */
      align-items: center;
      padding: 40px;
      overflow-y: auto;
    }

    .page-title {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 30px;
      color: #1976d2;
      text-align: center;
    }

    .dashboard-container {
      background-color: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      width: 800px;
      text-align: center;
    }

    .dashboard-container h2 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    .dashboard-container h3 {
      font-size: 24px;
      margin-bottom: 15px;
    }

    .search-bar {
      margin-bottom: 20px;
    }

    .search-bar input {
      width: 60%;
      padding: 10px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .button {
      padding: 15px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      width: 100%;
      margin-top: 15px;
      font-size: 18px;
      color: white;
    }

    .logout-btn {
      background-color: #d32f2f;
    }

    .logout-btn:hover {
      background-color: #b71c1c;
    }

    .clear-btn {
      background-color: #1976d2;
    }

    .clear-btn:hover {
      background-color: #1565c0;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      font-size: 18px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
    }

    th {
      background-color: #1976d2;
      color: white;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <img src="https://wallacefoundation.org/sites/default/files/2023-09/sfm-home-page-graphic.png" alt="Logo">
    <button>Home</button>
    <button>File</button>
    <button>Message</button>
    <button>Location</button>
    <button>Graph</button>
  </div>

  <div class="main-content">
    <div class="page-title">Nonprofit Resource Management</div> <!-- NEW TITLE ADDED -->
    
    <div class="dashboard-container">
      <h2>Admin Dashboard</h2>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by username..." onkeyup="filterHistory()">
      </div>
      <h3>Welcome, <span id="currentUser"></span></h3>
      <h3>Login History</h3>
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Login Time</th>
          </tr>
        </thead>
        <tbody id="historyTable">
        </tbody>
      </table>
      <button class="button logout-btn" onclick="logout()">Logout</button>
      <button class="button clear-btn" onclick="clearHistory()">Clear History</button>
    </div>
  </div>

  <script>
    let history = [];

    function loadLoginHistory() {
      history = JSON.parse(localStorage.getItem("loginHistory")) || [];
      let currentUser = localStorage.getItem("currentUser") || "Unknown User";
      document.getElementById("currentUser").textContent = currentUser;
      displayHistory(history);
    }

    function displayHistory(data) {
      let historyTable = document.getElementById("historyTable");
      historyTable.innerHTML = "";
      data.forEach(entry => {
        let row = `<tr>
            <td>${entry.username}</td>
            <td>${entry.timestamp}</td>
        </tr>`;
        historyTable.innerHTML += row;
      });
    }

    function filterHistory() {
      let input = document.getElementById("searchInput").value.toLowerCase();
      let filtered = history.filter(entry => entry.username.toLowerCase().includes(input));
      displayHistory(filtered);
    }

    function logout() {
      localStorage.removeItem("currentUser");
      window.location.href = "index.html";
    }

    function clearHistory() {
      localStorage.removeItem("loginHistory");
      history = [];
      document.getElementById("historyTable").innerHTML = "";
    }

    window.onload = loadLoginHistory;
  </script>

</body>
</html>
