<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard with Sidebar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 200px;
            background-color: #1976d2;
            color: white;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
        }

        .sidebar button {
            background: none;
            border: none;
            color: white;
            padding: 15px 20px;
            text-align: left;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
        }

        .sidebar button:hover {
            background-color: #1565c0;
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard-container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 400px;
            text-align: center;
        }

        .button {
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            margin-top: 10px;
            color: white;
        }

        .logout-btn {
            background-color: #d32f2f;
        }

        .logout-btn:hover {
            background-color: #b71c1c;
        }

        .clear-btn {
            background-color: #1976d2;
        }

        .clear-btn:hover {
            background-color: #1565c0;
        }

        table {
            width: 100%;
            margin-top: 10px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #1976d2;
            color: white;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <button>Home</button>
        <button>File</button>
        <button>Message</button>
        <button>Location</button>
        <button>Graph</button>
    </div>

    <div class="main-content">
        <div class="dashboard-container">
            <h2>Admin Dashboard</h2>
            <h3>Welcome, <span id="currentUser"></span></h3>
            <h3>Login History</h3>
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Login Time</th>
                    </tr>
                </thead>
                <tbody id="historyTable">
                </tbody>
            </table>
            <button class="button logout-btn" onclick="logout()">Logout</button>
            <button class="button clear-btn" onclick="clearHistory()">Clear History</button>
        </div>
    </div>

    <script>
        function loadLoginHistory() {
            let history = JSON.parse(localStorage.getItem("loginHistory")) || [];
            let historyTable = document.getElementById("historyTable");
            let currentUser = localStorage.getItem("currentUser") || "Unknown User";
            
            document.getElementById("currentUser").textContent = currentUser;
            historyTable.innerHTML = "";
            history.forEach(entry => {
                let row = `<tr>
                    <td>${entry.username}</td>
                    <td>${entry.timestamp}</td>
                </tr>`;
                historyTable.innerHTML += row;
            });
        }
    
        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }
    
        function clearHistory() {
            localStorage.removeItem("loginHistory");
            document.getElementById("historyTable").innerHTML = "";
        }
    
        window.onload = loadLoginHistory;
    </script>

</body>
</html>
