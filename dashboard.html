<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glowing Admin Dashboard</title>
  <style>
    :root {
      --primary-color: #00bcd4;
      --secondary-color: #008ba3;
      --glow-color: #4dd0e1;
      --background-gradient: linear-gradient(135deg, #e0f7fa, #ffffff);
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      overflow: hidden;
      background: var(--background-gradient);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .sidebar {
      width: 220px;
      background: var(--primary-color);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 30px;
      box-shadow: 4px 0 20px var(--glow-color);
      animation: floatSidebar 6s ease-in-out infinite alternate;
    }

    @keyframes floatSidebar {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    .sidebar img {
      width: 160px;
      margin-bottom: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px var(--glow-color);
      animation: glowLogo 4s infinite alternate;
    }

    @keyframes glowLogo {
      from { box-shadow: 0 0 15px var(--primary-color); }
      to { box-shadow: 0 0 30px var(--glow-color); }
    }

    .sidebar button {
      background: none;
      border: none;
      color: white;
      padding: 15px 25px;
      width: 100%;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }

    .sidebar button:hover {
      background-color: var(--secondary-color);
      transform: scale(1.05);
    }

    .main-content {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-title {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 30px;
      color: var(--primary-color);
      text-align: center;
      text-shadow: 0 0 8px var(--glow-color);
      animation: pulseTitle 3s infinite alternate;
    }

    @keyframes pulseTitle {
      0% { text-shadow: 0 0 8px var(--primary-color), 0 0 16px var(--primary-color); }
      100% { text-shadow: 0 0 20px var(--glow-color), 0 0 30px var(--glow-color); }
    }

    .dashboard-container {
      background: var(--background-gradient);
      padding: 40px;
      border-radius: 20px;
      width: 800px;
      text-align: center;
      box-shadow: 0 0 30px var(--glow-color);
      animation: floatDashboard 5s ease-in-out infinite alternate;
    }

    @keyframes floatDashboard {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    .dashboard-container h2, .dashboard-container h3 {
      margin-bottom: 20px;
      color: var(--secondary-color);
    }

    .search-bar input {
      width: 60%;
      padding: 10px;
      font-size: 18px;
      border: 1px solid var(--primary-color);
      border-radius: 5px;
      box-shadow: 0 0 10px var(--glow-color);
      margin-bottom: 20px;
    }

    .button {
      padding: 15px;
      border: none;
      border-radius: 5px;
      width: 100%;
      margin-top: 15px;
      font-size: 18px;
      color: white;
      background-color: var(--primary-color);
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px var(--glow-color);
    }

    .logout-btn {
      background-color: #d32f2f;
    }

    .logout-btn:hover {
      background-color: #b71c1c;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      font-size: 18px;
      box-shadow: 0 0 10px var(--glow-color);
      background: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
    }

    th {
      background-color: var(--primary-color);
      color: white;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <img src="https://wallacefoundation.org/sites/default/files/2023-09/sfm-home-page-graphic.png" alt="Logo">
  <button onclick="location.href='dashboard.html'">Home</button>
  <button onclick="location.href='file.html'">File</button>
  <button>Message</button>
  <button>Location</button>
  <button>Graph</button>
</div>

<div class="main-content">
  <div class="page-title">Nonprofit Resource Management</div>

  <div class="dashboard-container">
    <h2>Admin Dashboard</h2>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search by username..." onkeyup="filterHistory()">
    </div>
    <h3>Welcome, <span id="currentUser"></span></h3>
    <h3>Login History</h3>
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Login Time</th>
        </tr>
      </thead>
      <tbody id="historyTable"></tbody>
    </table>
    <button class="button logout-btn" onclick="logout()">Logout</button>
    <button class="button" onclick="clearHistory()">Clear History</button>
  </div>
</div>

<script>
let history = [];

function loadLoginHistory() {
  history = JSON.parse(localStorage.getItem("loginHistory")) || [];
  let currentUser = localStorage.getItem("currentUser") || "Unknown User";
  document.getElementById("currentUser").textContent = currentUser;
  displayHistory(history);
}

function displayHistory(data) {
  let historyTable = document.getElementById("historyTable");
  historyTable.innerHTML = "";
  data.forEach(entry => {
    let row = `<tr><td>${entry.username}</td><td>${entry.timestamp}</td></tr>`;
    historyTable.innerHTML += row;
  });
}

function filterHistory() {
  let input = document.getElementById("searchInput").value.toLowerCase();
  let filtered = history.filter(entry => entry.username.toLowerCase().includes(input));
  displayHistory(filtered);
}

function logout() {
  localStorage.removeItem("currentUser");
  window.location.href = "index.html";
}

function clearHistory() {
  localStorage.removeItem("loginHistory");
  history = [];
  document.getElementById("historyTable").innerHTML = "";
}

window.onload = loadLoginHistory;
</script>

</body>
</html>
